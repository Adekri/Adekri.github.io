<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co bylo v příběhu?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../spolecne/hra.css">
    <style>
        /* Text povídky pro předčítání */
        .text-pribehu {
            width: min(820px, 100%);
            max-height: 55vh;
            overflow-y: auto;
            padding: 24px 32px;
            border: 3px solid var(--inkoust);
            border-radius: 12px 18px 10px 20px / 18px 10px 20px 12px;
            background: var(--papir-svetly);
            box-shadow: 4px 5px 0 var(--linka);
            text-align: left;
            font-family: var(--nadpisy);
            font-size: 1.35rem;
            line-height: 1.6;
            -webkit-user-select: text;
            user-select: text;
        }
        .text-pribehu p { margin: 0 0 .8em; }
        .text-pribehu[hidden] { display: none; }

        /* Ano / Ne */
        .ano-ne .tlacitko { min-width: clamp(170px, 22vw, 300px); justify-content: center; font-size: clamp(2rem, 5vw, 3.6rem); }

        /* Seřazení */
        .sloty { display: flex; gap: clamp(12px, 2.4vw, 32px); justify-content: center; flex-wrap: wrap; }
        .slot {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: clamp(150px, 20vw, 260px);
            min-height: clamp(150px, 26vh, 260px);
            padding: 12px;
            border: 3px dashed var(--linka);
            border-radius: var(--rucni);
        }
        .slot .cislo {
            position: absolute;
            top: -20px;
            left: 50%;
            translate: -50% 0;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 3px solid var(--inkoust);
            border-radius: 50%;
            background: var(--papir);
            font-family: var(--nadpisy);
            font-weight: 800;
            font-size: 1.5rem;
        }
        .slot.plny { border-style: solid; border-color: var(--inkoust); background: var(--papir-svetly); }
        .slot .emoji { font-size: clamp(70px, 14vh, 140px); }
        .slot .popisek { font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 500; line-height: 1.15; }
        .karta.pouzita { visibility: hidden; }
        .poradi-karty .karta .emoji { font-size: clamp(70px, 14vh, 140px); }
    </style>
</head>
<body>
    <header class="lista">
        <a class="lista-zpet" href="../index.html">← Všechny hry</a>
        <h1 class="lista-nazev">Co bylo v příběhu?</h1>
        <span class="postup" id="postup"></span>
        <button class="ikonka" id="zvuk" aria-label="Předčítání nahlas"></button>
        <button class="ikonka" id="celaobrazovka" aria-label="Celá obrazovka"></button>
    </header>

    <main class="hra" id="hra"></main>

    <footer class="paticka">Obrázky: <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a> – CC BY-SA 4.0</footer>

    <script src="../spolecne/hra.js"></script>
    <script src="pribeh.js"></script>
    <script src="hra.js"></script>
</body>
</html>
