<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co bylo v příběhu?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../spolecne/hra.css">
    <style>
        /* Text povídky pro předčítání */
        .text-pribehu {
            width: min(760px, 100%);
            max-height: 55vh;
            overflow-y: auto;
            padding: 20px 28px;
            border-radius: var(--radius);
            background: var(--karta);
            box-shadow: var(--stin);
            text-align: left;
            font-size: 1.25rem;
            line-height: 1.55;
            -webkit-user-select: text;
            user-select: text;
        }
        .text-pribehu p { margin: 0 0 .8em; }
        .text-pribehu[hidden] { display: none; }

        /* Ano / Ne */
        .ano-ne .tlacitko { min-width: clamp(150px, 26vw, 260px); font-size: clamp(1.8rem, 4.5vw, 3rem); }
        .ano-ne .tlacitko.spatne { opacity: .4; animation: trest .45s; }
        .ano-ne .tlacitko.ukaz { animation: skok .6s 2; }

        /* Seřazení */
        .sloty { display: flex; gap: clamp(8px, 2vw, 20px); justify-content: center; flex-wrap: wrap; }
        .slot {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: clamp(110px, 20vw, 200px);
            min-height: clamp(120px, 22vh, 200px);
            padding: 8px;
            border: 4px dashed rgba(59, 47, 42, .25);
            border-radius: var(--radius);
        }
        .slot .cislo {
            position: absolute;
            top: -16px;
            left: 50%;
            translate: -50% 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--zluta);
            font-weight: 800;
            font-size: 1.4rem;
        }
        .slot.plny { border: 4px solid var(--zelena); background: var(--zelena-svetla); }
        .slot .emoji { font-size: clamp(54px, 10vh, 100px); line-height: 1.1; }
        .slot .popisek { font-size: clamp(.95rem, 2vw, 1.3rem); font-weight: 600; line-height: 1.15; }
        .karta.pouzita { visibility: hidden; }
    </style>
</head>
<body>
    <header class="lista">
        <a class="kulaty" href="../index.html" aria-label="Zpět na výběr her">🏠</a>
        <h1 class="lista-nazev">Co bylo v příběhu?</h1>
        <div class="hvezdy" id="hvezdy"></div>
        <button class="kulaty" id="celaobrazovka" aria-label="Celá obrazovka">⛶</button>
        <button class="kulaty" id="zvuk" aria-label="Zapnout nebo vypnout zvuk">🔊</button>
    </header>

    <main class="hra" id="hra"></main>

    <script src="../spolecne/hra.js"></script>
    <script src="pribeh.js"></script>
    <script src="hra.js"></script>
</body>
</html>
