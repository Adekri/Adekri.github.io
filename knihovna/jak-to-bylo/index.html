<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jak to bylo dál?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../spolecne/hra.css">
    <style>
        .hra {
            /* Komiks 2 × 2 co největší, ale tak, aby se vešel na šířku i na výšku obrazovky */
            --mezera: 58px;
            --velka: min(calc((100vw - 80px - var(--mezera)) / 2), calc((100vh - 196px - var(--mezera)) / 2 * 4 / 3));
            gap: 10px;
            padding-top: 8px;
        }
        /* Licence v rohu, ať nezabírá místo */
        .paticka { position: fixed; right: 10px; bottom: 2px; padding: 0; }

        .nazev-pohadky { margin: 0; font-family: var(--nadpisy); font-size: clamp(1.5rem, 3vw, 2.4rem); font-weight: 800; line-height: 1.1; }

        .zahlavi-hry { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 24px; min-height: 52px; }
        .zahlavi-hry .titulek { min-height: 0; font-size: clamp(1.1rem, 2vw, 1.6rem); }

        .komiks { position: relative; display: grid; grid-template-columns: repeat(2, auto); gap: var(--mezera); }

        /* Šipky mezi okénky ukazují, kudy příběh pokračuje (i pro děti, které ještě neumí číst) */
        .sipka {
            position: absolute;
            width: 64px;
            height: 64px;
            color: var(--inkoust);
            pointer-events: none;
        }
        .sipka.doprava { left: calc(50% - 32px); top: calc(var(--velka) * 3 / 8 - 32px); }
        .sipka.dolu    { left: calc(var(--velka) * 1.5 + var(--mezera) - 32px); top: calc(50% - 32px); }
        .sipka.doleva  { left: calc(50% - 32px); top: calc(var(--velka) * 3 / 4 + var(--mezera) + var(--velka) * 3 / 8 - 32px); }

        .policko {
            position: relative;
            width: var(--velka);
            aspect-ratio: 4 / 3;
            border-radius: 10px;
        }
        .policko.nad .panel { outline: 5px solid var(--okr); outline-offset: 3px; }
        /* Číslo pozice v rohu */
        .policko .roh {
            position: absolute;
            left: -12px;
            top: -12px;
            z-index: 3;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 3px solid var(--inkoust);
            border-radius: 50%;
            background: var(--papir-svetly);
            font-family: var(--nadpisy);
            font-size: 1.4rem;
            font-weight: 800;
            pointer-events: none;
        }
        /* Věta po vyřešení: proužek přes spodní okraj okénka */
        .policko .popis {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            padding: .3em .7em .35em;
            border-top: 3px solid var(--inkoust);
            border-radius: 0 0 10px 10px;
            background: rgba(251, 247, 238, .94);
            font-family: var(--nadpisy);
            font-size: clamp(1rem, 1.6vw, 1.45rem);
            line-height: 1.2;
            text-align: center;
        }

        .panel {
            position: absolute;
            inset: 0;
            z-index: 1;
            padding: 0;
            border: 3px solid var(--inkoust);
            border-radius: 10px;
            overflow: hidden;
            background: none;
            box-shadow: 3px 4px 0 var(--linka);
            cursor: grab;
            touch-action: none;
        }
        .panel svg { display: block; width: 100%; height: 100%; pointer-events: none; }
        .panel.tazeny { z-index: 100; cursor: grabbing; box-shadow: 8px 12px 18px rgba(46, 38, 32, .35); rotate: -1.5deg; }
        .panel.spravne { border-color: var(--zelena); border-width: 5px; cursor: default; }
        .panel.spatne { border-color: var(--cervena); border-width: 5px; }
        .panel.vybrany { outline: 5px solid var(--okr); outline-offset: 3px; rotate: -1deg; }

    </style>
</head>
<body>
    <header class="lista">
        <a class="lista-zpet" href="../index.html">← Všechny hry</a>
        <h1 class="lista-nazev">Jak to bylo dál?</h1>
        <span class="postup" id="postup"></span>
        <button class="ikonka" id="zvuk" aria-label="Předčítání nahlas"></button>
        <button class="ikonka" id="celaobrazovka" aria-label="Celá obrazovka"></button>
    </header>

    <main class="hra" id="hra"></main>

    <footer class="paticka">Obrázky: <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a> – CC BY-SA 4.0</footer>

    <script src="../spolecne/hra.js"></script>
    <script src="pribehy.js"></script>
    <script src="hra.js"></script>
</body>
</html>
